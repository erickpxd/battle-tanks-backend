config:
  target: "http://localhost:5049"
  phases:
    - duration: 10
      arrivalRate: 5
      name: "Warm up"
    - duration: 20
      arrivalRate: 20
      name: "Sustained load"

scenarios:
  - name: "List Rooms"
    flow:
      - get:
          url: "/api/room"
          expect:
            - statusCode: 200
            - contentType: json
